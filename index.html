<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="HR Recruitment & Talent Acquisition System - Mobile Web App">
  <meta name="theme-color" content="#2563EB">
  <title>HR Recruitment System | ระบบบริหารการสรรหาบุคลากร</title>

  <!-- Google Fonts: Kanit (Thai) & Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen">
      <div class="login-container">
        <!-- Rendered by App.renderLoginForm() with fallback structure -->
        <div class="login-brand">
          <div class="login-logo-icon">
            <i class="fas fa-id-badge"></i>
          </div>
          <h2 class="login-title">ระบบบริหารการสรรหาบุคลากร</h2>
          <p class="login-subtitle">HR Recruitment & Talent Acquisition System</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">อีเมล / Email</label>
            <input type="email" id="login-email" class="form-input" placeholder="hr@company.com" required value="hr@company.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">รหัสผ่าน / Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="1234" required value="1234">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
            <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ / Sign In
          </button>
        </form>

        <div class="demo-accounts-box">
          <div class="demo-title">
            <i class="fas fa-bolt text-warning"></i> บัญชีทดสอบระบบ (คลิกเพื่อเข้าใช้งาน)
          </div>
          <div class="demo-buttons-grid">
            <button type="button" class="demo-btn" data-email="hr@company.com">
              <span class="avatar-sm">👩‍💼</span>
              <div>
                <span class="demo-name">สมศรี (HR)</span>
                <span class="demo-role">HR Admin</span>
              </div>
            </button>
            <button type="button" class="demo-btn" data-email="david@company.com">
              <span class="avatar-sm">👨‍💼</span>
              <div>
                <span class="demo-name">David (HR)</span>
                <span class="demo-role">HR Admin</span>
              </div>
            </button>
            <button type="button" class="demo-btn" data-email="somchai@email.com">
              <span class="avatar-sm">👨‍💻</span>
              <div>
                <span class="demo-name">สมชาย</span>
                <span class="demo-role">Developer</span>
              </div>
            </button>
            <button type="button" class="demo-btn" data-email="sunisa@email.com">
              <span class="avatar-sm">👩‍💻</span>
              <div>
                <span class="demo-name">สุนิสา</span>
                <span class="demo-role">HR Specialist</span>
              </div>
            </button>
            <button type="button" class="demo-btn" data-email="john@email.com">
              <span class="avatar-sm">👨‍🦱</span>
              <div>
                <span class="demo-name">John Smith</span>
                <span class="demo-role">Marketing</span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main App Shell (Hidden until authenticated) -->
    <div id="main-app" class="hidden">
      <!-- Top Sticky Header -->
      <header id="app-header">
        <div class="header-left">
          <button id="back-btn" class="header-btn hidden" aria-label="Go Back">
            <i class="fas fa-arrow-left"></i>
          </button>
          <h1 id="page-title">แดชบอร์ด</h1>
        </div>
        <div class="header-right">
          <button id="lang-toggle" class="header-btn" title="Toggle Language">
            <span id="lang-label">EN</span>
          </button>
          <button id="theme-toggle" class="header-btn" title="Toggle Dark/Light Mode">
            <i class="fas fa-moon"></i>
          </button>
          <div id="user-menu-btn" class="avatar avatar-sm" title="User Menu" style="cursor: pointer;">
            👤
          </div>
        </div>
      </header>

      <!-- Dynamic Content View Area -->
      <main id="app-content"></main>

      <!-- Bottom Navigation Bar (Context & Role Sensitive) -->
      <nav id="bottom-nav"></nav>

      <!-- Floating Action Button (FAB) -->
      <button id="fab" class="fab hidden" aria-label="Action">
        <i class="fas fa-plus"></i>
      </button>
    </div>

    <!-- Modal Dialog Overlay -->
    <div id="modal-overlay" class="hidden">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title"></h3>
          <button class="modal-close" aria-label="Close modal">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-footer" class="modal-footer"></div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>
  </div>

  <!-- Application Scripts Loaded in Dependency Order -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/candidates.js"></script>
  <script src="js/interviews.js"></script>
  <script src="js/resumes.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
